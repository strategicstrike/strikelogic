<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StrikeLogic – Live Option Trades</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <h1>StrikeLogic</h1>
    <p>Rule-Based Premium Option Trades</p>
  </header>

  <!-- ADMIN LOGIN -->
  <section class="card">
    <h2>Admin Login</h2>

    <input
      type="password"
      id="adminPassword"
      placeholder="Enter admin password"
    />

    <button id="loginBtn">Login</button>
  </section>

  <!-- ADMIN PANEL -->
  <section id="adminSection" class="card hidden">
    <h2>Add / Update Trade</h2>

    <input id="symbol" placeholder="Symbol (NIFTY 26000 CE)" />
    <input id="entry" placeholder="Entry Price" type="number" />
    <input id="exit" placeholder="Exit Price (leave blank if running)" type="number" />
    <input id="qty" placeholder="Quantity" type="number" />
    <input id="logic" placeholder="Logic / Reason" />

    <button onclick="addTrade()">Save Trade</button>
  </section>

  <!-- MONTHLY P&L -->
  <section class="card">
    <h2>Monthly P&L</h2>
    <h3 id="monthlyPnL">₹0</h3>
  </section>

  <!-- LIVE TRADES -->
  <section class="card">
    <h2>🟢 Live Trades</h2>
    <div id="liveTrades"></div>
  </section>

  <!-- CLOSED TRADES -->
  <section class="card">
    <h2>🔴 Closed Trades</h2>
    <div id="closedTrades"></div>
  </section>

  <!-- DISCLAIMER -->
  <footer>
    ⚠ Educational purpose only. We are NOT SEBI registered.
  </footer>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
