<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StrikeLogic | Premium Option Trades</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1220;
  color:#fff;
}
header{
  text-align:center;
  padding:20px;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}
h1{margin:0;color:#4da3ff}
.container{max-width:900px;margin:auto;padding:20px}

.card{
  background:#121c32;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}
button{
  background:#4da3ff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
.trade{
  border-bottom:1px solid #2a3a5e;
  padding:10px 0;
}
.profit{color:#00ff9d;font-weight:bold}
.loss{color:#ff4d4d;font-weight:bold}

#adminPanel{display:none}

.disclaimer{
  text-align:center;
  color:#ff4d4d;
  margin-top:20px;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>StrikeLogic</h1>
  <p>Rule-Based Premium Option Trades</p>
</header>

<div class="container">

<!-- ADMIN LOGIN (ONLY FOR YOU) -->
<div class="card" id="loginBox">
  <h3>Admin Login</h3>
  <input type="password" id="adminPass" placeholder="Enter Admin Password">
  <button onclick="adminLogin()">Login</button>
  <p style="text-align:center;font-size:13px;">Subscribers do NOT need login</p>
</div>

<!-- ADMIN PANEL -->
<div class="card" id="adminPanel">
  <h3>Add Trade</h3>
  <input id="index" placeholder="Index (NIFTY / BANKNIFTY)">
  <input id="strike" placeholder="Strike (26000 CE)">
  <input id="entry" type="number" placeholder="Entry Price">
  <input id="exit" type="number" placeholder="Exit Price">
  <input id="qty" type="number" value="325">
  <button onclick="addTrade()">Save Trade</button>
</div>

<!-- LIVE TRADES -->
<div class="card">
  <h3>📈 Live / Closed Trades</h3>
  <div id="trades"></div>
</div>

<div class="disclaimer">
⚠️ Educational purpose only. We are NOT SEBI registered.
</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://strike-logic-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const tradesRef = ref(db,"trades");

/* AUTO LOAD TRADES FOR EVERYONE */
onValue(tradesRef,(snapshot)=>{
  const data = snapshot.val();
  const box = document.getElementById("trades");
  box.innerHTML = "";

  if(!data){
    box.innerHTML = "<p>No trades yet</p>";
    return;
  }

  Object.values(data).reverse().forEach(t=>{
    const pnl = (t.exit - t.entry) * t.qty;
    box.innerHTML += `
      <div class="trade">
        <b>${t.index} ${t.strike}</b><br>
        Entry: ${t.entry} | Exit: ${t.exit} | Qty: ${t.qty}<br>
        <span class="${pnl>=0?'profit':'loss'}">P/L: ₹${pnl}</span>
      </div>
    `;
  });
});

/* ADMIN LOGIN */
window.adminLogin = ()=>{
  const p = document.getElementById("adminPass").value;
  if(p==="225522"){
    document.getElementById("adminPanel").style.display="block";
    document.getElementById("loginBox").style.display="none";
  }else{
    alert("Wrong password");
  }
}

/* ADD TRADE */
window.addTrade = ()=>{
  const trade={
    index:index.value,
    strike:strike.value,
    entry:Number(entry.value),
    exit:Number(exit.value),
    qty:Number(qty.value),
    time:Date.now()
  };
  push(tradesRef,trade);
  entry.value=""; exit.value="";
}
</script>

</body>
</html>
